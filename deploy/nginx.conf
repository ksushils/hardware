# /etc/nginx/sites-available/techrevive  →  ln -s ../sites-available/techrevive /etc/nginx/sites-enabled/
# Replace shop.example.com with your domain, then: nginx -t && systemctl reload nginx
# HTTPS: certbot --nginx -d shop.example.com
server {
    listen 80;
    server_name shop.example.com;

    client_max_body_size 30m;   # product images, hero video, Excel imports

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3100;
        expires 365d;
        add_header Cache-Control "public, immutable";
    }
    location ~ ^/(uploads|img|video)/ {
        proxy_pass http://127.0.0.1:3100;
        expires 30d;
    }
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
